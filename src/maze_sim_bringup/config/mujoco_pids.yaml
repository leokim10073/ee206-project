# PID gains the MuJoCo plugin uses to turn position and velocity commands into joint torque.
# u_clamp is the UR7e joint torque limit. Velocity gains were tuned against the board's load:
# zero command holds within 2e-4 rad, 0.1 rad/s tracks within 1e-3; 1.5x the gains starts to ring.
# Position gains: the integral removes the board's 0.009 rad sag on wrist_1 within 1 s (it took
# > 10 s at i = p/10), so the board is level again when /sim/reset places the ball.
/**:
  ros__parameters:
    pid_gains:
      position:
        shoulder_pan_joint:
          p: 4000.0
          i: 20000.0
          d: 300.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        shoulder_lift_joint:
          p: 4000.0
          i: 20000.0
          d: 300.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        elbow_joint:
          p: 4000.0
          i: 20000.0
          d: 300.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        wrist_1_joint:
          p: 400.0
          i: 2000.0
          d: 30.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
          i_clamp_min: -14.0
        wrist_2_joint:
          p: 400.0
          i: 2000.0
          d: 30.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
          i_clamp_min: -14.0
        wrist_3_joint:
          p: 400.0
          i: 2000.0
          d: 30.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
          i_clamp_min: -14.0
      velocity:
        shoulder_pan_joint:
          p: 400.0
          i: 4000.0
          d: 0.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        shoulder_lift_joint:
          p: 400.0
          i: 4000.0
          d: 0.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        elbow_joint:
          p: 400.0
          i: 4000.0
          d: 0.0
          u_clamp_max: 150.0
          u_clamp_min: -150.0
          i_clamp_max: 75.0
          i_clamp_min: -75.0
        wrist_1_joint:
          p: 40.0
          i: 400.0
          d: 0.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
          i_clamp_min: -14.0
        wrist_2_joint:
          p: 40.0
          i: 400.0
          d: 0.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
          i_clamp_min: -14.0
        wrist_3_joint:
          p: 40.0
          i: 400.0
          d: 0.0
          u_clamp_max: 28.0
          u_clamp_min: -28.0
          i_clamp_max: 14.0
